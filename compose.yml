# compose.yml
version: "3.9"

services:
  postgres:
    image: docker.io/postgres:16-alpine
    container_name: mediaflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediaflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: mediaflow_db
    ports:
      - "5431:5432"
    volumes:
      - mediaflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediaflow -d mediaflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: docker.io/redis:7-alpine
    container_name: mediaflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mediaflow_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mediaflow_pgdata:
  mediaflow_redisdata: